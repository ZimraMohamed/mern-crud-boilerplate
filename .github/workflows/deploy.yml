name: Auto Deploy
on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh Deployment to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. System Level Cache Clean (Ubuntu)
            echo "Cleaning Ubuntu system cache..."
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
            
            # 2. Project Clean
            cd ~/mern-crud-boilerplate || exit
            git fetch --all
            git reset --hard origin/deploy
            
            # 3. Frontend: Absolute Fresh Start
            cd frontend
            echo "Removing node_modules and clearing NPM cache..."
            rm -rf node_modules dist
            npm cache clean --force
            npm install
            npm run build
            
            # 4. Nginx: Clear internal proxy/fastcgi caches
            echo "Clearing Nginx internal cache..."
            sudo rm -rf /var/lib/nginx/proxy/*
            sudo rm -rf /var/lib/nginx/body/*
            
            # 5. Sync Files to Web Root
            sudo mkdir -p /var/www/pdsa-frontend
            sudo rm -rf /var/www/pdsa-frontend/*
            sudo cp -r dist/* /var/www/pdsa-frontend/
            sudo chown -R ubuntu:ubuntu /var/www/pdsa-frontend
            
            # 6. Verify and Restart Nginx
            sudo nginx -t && sudo systemctl restart nginx
            
            echo "Deployment successful. Machine and App caches cleared!"