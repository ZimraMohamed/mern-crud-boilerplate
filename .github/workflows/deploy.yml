name: Auto Deploy
on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh Deployment to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Error Handling
            set -e 

            # 2. Project Recovery & Git Sync
            # We enter the folder and force Git to re-link to GitHub
            cd ~/mern-crud-boilerplate || exit
            
            echo "Refreshing Git Remote..."
            git remote remove origin || true
            git remote add origin https://github.com/ZimraMohamed/mern-crud-boilerplate.git
            
            echo "Fetching 'deploy' branch..."
            git fetch origin deploy
            
            echo "Restoring deleted files (Hard Reset)..."
            git reset --hard FETCH_HEAD
            
            # 3. Navigate to Frontend
            if [ -d "frontend" ]; then
              cd frontend
            fi

            echo "Current files in $(pwd):"
            ls -F

            # 4. Fresh Build Process
            echo "Installing dependencies (this may take a minute)..."
            npm install
            
            echo "Running npm build..."
            npm run build
            
            # 5. Sync to Nginx Web Root
            echo "Deploying to /var/www/pdsa-frontend..."
            sudo mkdir -p /var/www/pdsa-frontend
            sudo rm -rf /var/www/pdsa-frontend/*
            
            # Handles both 'dist' (Vite) and 'build' (CRA)
            if [ -d "dist" ]; then
              sudo cp -r dist/* /var/www/pdsa-frontend/
            elif [ -d "build" ]; then
              sudo cp -r build/* /var/www/pdsa-frontend/
            else
              echo "Error: Build output folder not found!"
              exit 1
            fi

            # 6. Final Permissions & Nginx Restart
            sudo chown -R ubuntu:ubuntu /var/www/pdsa-frontend
            sudo chmod -R 755 /var/www/pdsa-frontend
            
            echo "Verifying Nginx and Restarting..."
            sudo nginx -t
            sudo systemctl restart nginx
            
            echo "Deployment Successful! Your site is live."