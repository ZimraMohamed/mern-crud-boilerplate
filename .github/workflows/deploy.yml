name: Auto Deploy
on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh Deployment to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Error Handling & System Cleanup
            set -e 
            echo "Cleaning Ubuntu system cache..."
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
            
            # 2. Force Git to match GitHub exactly
            cd ~/mern-crud-boilerplate || exit
            echo "Fetching latest code from GitHub..."
            git fetch --all
            git reset --hard origin/deploy
            
            # 3. Navigate to Frontend (Handles both subfolder and root structures)
            if [ -d "frontend" ]; then
              cd frontend
            fi

            echo "Current Directory: $(pwd)"
            
            # 4. Fresh Build Process
            echo "Removing old modules and building..."
            rm -rf node_modules dist
            npm install
            npm run build
            
            # 5. Sync to Nginx Web Root
            echo "Deploying to /var/www/pdsa-frontend..."
            sudo mkdir -p /var/www/pdsa-frontend
            sudo rm -rf /var/www/pdsa-frontend/*
            
            if [ -d "dist" ]; then
              sudo cp -r dist/* /var/www/pdsa-frontend/
            else
              echo "Error: Build failed, dist folder not found!"
              exit 1
            fi

            # 6. Final Permissions & Nginx Restart
            sudo chown -R ubuntu:ubuntu /var/www/pdsa-frontend
            sudo chmod -R 755 /var/www/pdsa-frontend
            
            echo "Testing Nginx configuration..."
            sudo nginx -t
            sudo systemctl restart nginx
            
            echo "Deployment Successful!"