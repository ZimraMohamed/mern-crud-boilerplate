name: Auto Deploy
on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh Deployment to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Exit immediately if a command fails
            set -e 

            echo "Cleaning Ubuntu system cache..."
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
            
            # 1. Enter project and Force Sync
            cd ~/mern-crud-boilerplate || exit
            git fetch origin deploy
            git reset --hard origin/deploy
            
            # 2. Frontend Build with Path Check
            # We check if frontend folder exists; if not, we assume we are in it.
            if [ -d "frontend" ]; then
              cd frontend
            fi

            echo "Current Directory: $(pwd)"
            echo "Checking for package.json..."
            ls -la package.json

            echo "Removing node_modules and clearing NPM cache..."
            rm -rf node_modules dist
            npm cache clean --force
            npm install
            npm run build
            
            # 3. Clean and Sync Nginx Root
            echo "Deploying to Nginx web root..."
            sudo rm -rf /var/www/pdsa-frontend/*
            
            # Check if dist was actually created
            if [ -d "dist" ]; then
              sudo cp -r dist/* /var/www/pdsa-frontend/
            else
              echo "Error: dist folder not found!"
              exit 1
            fi

            sudo chown -R ubuntu:ubuntu /var/www/pdsa-frontend
            
            # 4. Verify and Restart Nginx
            sudo nginx -t && sudo systemctl restart nginx
            
            echo "Deployment successful!"