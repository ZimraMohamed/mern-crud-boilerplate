name: React Deployment to EC2
on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # Source is the 'dist' folder created on the GitHub Runner
          source: "frontend/dist/*"
          # Target is a temporary folder on your EC2
          target: "/home/ubuntu/temp-build"
          strip_components: 2

      - name: Move files and Restart Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Clean and Move to Nginx root
            sudo mkdir -p /var/www/pdsa-frontend
            sudo rm -rf /var/www/pdsa-frontend/*
            sudo mv /home/ubuntu/temp-build/* /var/www/pdsa-frontend/
            
            # Cleanup temp folder
            rm -rf /home/ubuntu/temp-build
            
            # Fix Permissions
            sudo chown -R ubuntu:ubuntu /var/www/pdsa-frontend
            sudo chmod -R 755 /var/www/pdsa-frontend
            
            # Restart Nginx
            sudo nginx -t
            sudo systemctl restart nginx
            echo "Deployment successful! Built on GitHub, served on EC2."