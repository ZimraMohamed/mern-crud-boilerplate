name: Auto Deploy
on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh Deployment to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e 

            # 1. Recovery: Force Git to redownload what you deleted
            cd ~/mern-crud-boilerplate || exit
            echo "Repairing repository and fetching latest code..."
            git fetch origin deploy
            git reset --hard origin/deploy
            
            # 2. Enter Frontend (Now files are back)
            if [ -d "frontend" ]; then
              cd frontend
            fi

            echo "Verified files in $(pwd):"
            ls -F

            # 3. Fresh Build
            echo "Installing dependencies..."
            npm install
            
            echo "Building Vite project..."
            npm run build
            
            # 4. Final Deploy to Nginx
            # Nginx is looking at /var/www/pdsa-frontend
            echo "Deploying to Nginx web root..."
            sudo mkdir -p /var/www/pdsa-frontend
            sudo rm -rf /var/www/pdsa-frontend/*
            
            if [ -d "dist" ]; then
              sudo cp -r dist/* /var/www/pdsa-frontend/
              echo "Files copied to /var/www/pdsa-frontend successfully."
            else
              echo "ERROR: dist folder was not created! Check npm run build output above."
              exit 1
            fi

            # 5. Permissions and Restart
            sudo chown -R ubuntu:ubuntu /var/www/pdsa-frontend
            sudo chmod -R 755 /var/www/pdsa-frontend
            sudo nginx -t && sudo systemctl restart nginx
            
            echo "Deployment Successful!"ss